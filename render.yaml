# Render blueprint. Import this once from the Render dashboard and the service
# is created from it; after that every push to master redeploys.
#
# The site serves data/archive/*.csv and never calls ESPN, so it needs no
# credentials. ESPN_S2 and SWID stay on the machine that runs weekly_update.py.
services:
  - type: web
    name: we-are-how-u-mean
    runtime: python
    # Starter: 512MB, always on. Measured peak is 258MB with every page and
    # every season cached in one process, which is the worst the caches get -
    # st.cache_data is global, so more viewers do not multiply it. Standard's
    # 2GB was picked on a guess before measuring and is not needed.
    #
    # Not free: the free tier sleeps after ~15 minutes idle, and a site checked
    # a few times a week is then a cold start almost every visit. Plans are a
    # dropdown in the dashboard, so this is easy to change either way.
    plan: starter
    region: ohio
    branch: master
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; 0.0.0.0 so the proxy can reach it.
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      # Set APP_PASSWORD in the Render dashboard to put the site behind a
      # shared password. Leave it unset and the site is public. Never commit a
      # value here.
      - key: APP_PASSWORD
        sync: false
